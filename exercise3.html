<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .request-button{
      background-color: black;
      color: white;
      height: 40px;
      width: 146px;
      border: none;
      cursor: pointer;
      border-radius: 2px;
      margin-bottom: 23px;
    }
    .add-button{
      background-color: rgb(251, 208, 18);
      color: white;
      height: 40px;
      width: 186px;
      border: none;
      cursor: pointer;
      border-radius: 22px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 23px;
    }
    .sign-button{
      background-color: rgb(49, 145, 8);
      color: white;
      height: 40px;
      width: 131px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 23px;
    }
    .get-button{
      background-color: rgb(8, 91, 191);
      color: white;
      height: 40px;
      width: 131px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 23px;
    }
    .download-button{
      background-color: rgb(248, 251, 254);
      color: rgb(66, 51, 51);
      height: 40px;
      width: 131px;
      border: 2px solid black;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 23px;

    }
    .apply-button{
      background-color: rgb(17, 112, 207);
      color: rgb(255, 231, 231);
      height: 40px;
      width: 257px;
      border:none;
      cursor: pointer;
      border-radius: 28px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 23px;
    }
    .save-button{
      background-color: rgb(248, 251, 254);
      color: rgb(10, 138, 250);
      height: 40px;
      width: 107px;
      border: 2px solid rgb(6, 98, 134);
      cursor: pointer;
      border-radius: 35px;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>
    <button class="request-button">Request Now</button><br>
    <button class="add-button">Add to Cart</button><br>
    <button class="sign-button">Sign up</button><br>
    <button class="get-button">Get Started</button><br>
    <button class="download-button">Download</button><br>
    <button class="apply-button">Apply on company website</button><br>

    <button class="save-button">Save</button>
</body>
</html>
