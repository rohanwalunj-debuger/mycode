<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            margin-top: 0;
            margin-bottom: 0;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;

        }

        .new {
            color: red;
            text-align: center;
            margin-bottom: 12px;
        }

        .macbook {
            font-weight: bold;
            font-size: 22px;
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 12px;


        }

        .super {
            font-weight: bold;
            font-size: 43px;
            margin-bottom: 12px;
        }

        .dollar {
            color: grey;
            margin-bottom: 12px;

        }

        .button {
            background-color: blue;
            color: white;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 32px;
            display: block;
            /* Changes the button from inline to block */
            margin: 0 auto;
            /* Centers horizontally */
      
        }
    </style>
</head>

<body>
    <p class="new">New</p>
    <p class="macbook">Mackbook pro</p>
    <p class="super">Supercharged for pros.</p>
    <p class="dollar">from $1999</p>
    <button class="button">Buy</button>
</body>

</html>
