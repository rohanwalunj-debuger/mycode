<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex 4</title>
  <style>
    .back-button {
      margin: 5px;
      padding: 8px;
    }

    .next-button {
      margin: 5px;
      padding: 8px;
    }

    .stretch-button {
      background-color: green;
      color: white;
      font-weight: bold;
      margin: 20px;
      padding: 23px;
      border: none;
      transition: margin 1s, padding 1s, box-shadow 1s;

    }

    .stretch-button:hover {
      margin: 40px;
      padding: 34px;
      box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body>
  <button class="back-button">Back</button>
  <a href="https://google.com">1</a>
  <a href="https://google.com">2</a>
  <a href="https://google.com">3</a>
  <a href="https://google.com">4</a>
  <a href="https://google.com">5</a>
  <button class="next-button">Next</button>

  <button class="stretch-button">stretch</button>
</body>

</html>
