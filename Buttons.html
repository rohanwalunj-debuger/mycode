<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons</title>
  <style>
    
    .subscribe-button{
      background-color: rgb(220, 4, 4);
      color: white;
      border: none;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left:16px;
      padding-right:16px;

      border-radius: 3px;
      cursor: pointer;
      margin-right: 8px;
      transition: opacity 0.15s;
      vertical-align: top;
    }
    .subscribe-button:hover{
       opacity: 0.8;
    }
    .subscribe-button:active{
      opacity: 0.4;
    }
    .join-button{
      background-color: white;
      /* border-color: rgb(18, 18, 219);
      border-style: solid;
      border-width: 1px; */
      border: 2px solid black;
      color: blue;
      padding-top: 9px;
      padding-bottom: 9px;
      padding-left:16px;
      padding-right:16px;


      border-radius: 2px;
      cursor: pointer;
      transition: background-color 1s, color 1s;

      
    }
    .join-button:hover{
      background-color: blue;
      color: white;
      
    }
    .join-button:active{
      opacity: 0.7;
    }

    .tweet-button{
      background-color: #3333eb;
      color: white;
      border: none;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left:16px;
      padding-right:16px;
    
      border-radius: 34px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-left: 8px;
      transition: box-shadow 0.15s;
      vertical-align: top;
      

    }
    .tweet-button:hover{
      box-shadow: 5px 5px 10px rgba(0,0 ,0 ,0.15 );

    }

  </style>
</head>
<body>
    <button class="subscribe-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
  </body>
</html>
