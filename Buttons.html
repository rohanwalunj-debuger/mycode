<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons</title>
  <style>
    
    .subscribe-button{
      background-color: rgb(220, 4, 4);
      color: white;
      border: none;
      height: 40px;
      width: 106px;
      border-radius: 3px;
      cursor: pointer;
      margin-right: 8px;
    }
    .join-button{
      background-color: white;
      border-color: rgb(18, 18, 219);
      border-style: solid;
      border-width: 1px;
      color: blue;
      height: 40px;
      width: 61px;
      border-radius: 2px;
      cursor: pointer;
    }

    .tweet-button{
      background-color: #3333eb;
      color: white;
      border: none;
      height: 36px;
      width: 72px;
      border-radius: 34px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-left: 8px;

    }

  </style>
</head>
<body>
    <button class="subscribe-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
  </body>
</html>
